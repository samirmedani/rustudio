<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Rustudio · Mixeur Tauri</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#11151e;color:#f0f5fb;font:16px "Segoe UI",sans-serif}
main{height:100%;padding:24px;display:flex;flex-direction:column;gap:16px}
header{font-size:20px;line-height:28px}
#status{font-size:14px;line-height:20px;color:#aab6c9}
#faders{display:flex;gap:16px}
.fader{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0;background:#1b222e;border:1px solid #303b4a;border-radius:8px}
.label{font-size:14px;line-height:20px;color:#e1eaf5}
.rail{position:relative;width:50px;height:219px}
.track,.fill{position:absolute;left:21px;width:8px;border-radius:6px}
.track{top:12px;height:195px;background:#10141b}
.fill{bottom:12px;background:var(--accent)}
.knob{position:absolute;left:4px;width:42px;height:24px;background:#dde6f1;border-radius:6px;display:grid;place-items:center}
.knob::before{content:"";width:24px;height:2px;background:var(--accent)}
.value{font-size:18px;line-height:28px;color:var(--accent)}
[hidden]{display:none!important}
</style>
<main>
<header>Rustudio · Mixeur Tauri</header>
<div id="status">En attente du moteur simulé…</div>
<div id="faders"></div>
</main>
<script>
"use strict";
const rows = ["#73a9ff","#5cdbc8","#f6a96c","#d4a0ff"].map((accent,i)=>{
  const card=document.createElement("div");
  card.className="fader";card.style.setProperty("--accent",accent);
  card.innerHTML='<div class="label">Fader '+(i+1)+'</div><div class="rail"><i class="track"></i><i class="fill" hidden></i><i class="knob" hidden></i></div><div class="value">—</div>';
  document.querySelector("#faders").append(card);
  return {fill:card.querySelector(".fill"),knob:card.querySelector(".knob"),value:card.querySelector(".value"),previous:null};
});
let online=false;
async function read(){
  const start=performance.now();
  let levels=null;
  try{
    const response=await fetch("/api/live",{cache:"no-store"});
    if(response.ok){const data=await response.json();if(data.connected)levels=data.live.fader_positions;}
  }catch{}
  if(online!==!!levels){
    online=!!levels;
    document.querySelector("#status").textContent=online?"Positions des quatre faders · moteur simulé · lecture seule":"En attente du moteur simulé…";
  }
  rows.forEach((row,i)=>{
    const value=levels?.[i]??null;
    if(row.previous===value)return;
    row.previous=value;
    row.fill.hidden=row.knob.hidden=value===null;
    if(value!==null){
      const height=value*195/255;
      row.fill.style.height=height+"px";row.knob.style.top=(195-height)+"px";
    }
    row.value.textContent=value===null?"—":Math.round(value*100/255)+" %";
  });
  setTimeout(read,Math.max(0,(online?20:250)-(performance.now()-start)));
}
read();
</script>
</html>

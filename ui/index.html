<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustudio</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="/ui/app.css">

</head>
<body>
<div class="ambient" id="glow"><span class="a"></span><span class="b"></span><span class="c"></span><span class="d"></span></div>
<div id="app">
  <aside>
    <div class="brand"><img src="/icon.png" width="38" height="38" alt=""><div><b>Rustudio</b><small>Ton matériel, ton espace</small></div></div>
    <nav id="main-nav" aria-label="Rustudio">
      <button data-p="devices" data-i="usb" class="on" title="Mes appareils"><span>Mes appareils</span></button>
      <button data-p="modules" data-i="grid" title="Modules"><span>Modules</span></button>
    </nav>
    <div class="module-space" id="module-space" hidden><small>ESPACE APPAREIL</small><b id="module-name"></b><nav id="module-nav" aria-label="Appareil sélectionné"></nav></div>
    <div class="side-foot"><div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Connexion…</span></div><small id="conn-fw"></small><div class="upd-card" id="upd-card" style="display:none"><div class="upd-top"><span class="upd-dot"></span><b>Mise à jour proposée</b></div><small id="upd-txt"></small><button class="pill primary" id="upd-btn">Voir les nouveautés</button></div><div class="ver-row"><b id="ver-txt">Rustudio</b><span class="ver-state" id="ver-state"></span><button class="ibtn" id="ver-check" title="Rechercher une mise à jour"></button></div></div>
  </aside>
  <main id="main-content">
    <header>
      <div><div class="eyebrow" id="h-eye">Rustudio</div><h1 id="h-title">Mes appareils</h1><p id="h-sub">Ton matériel et ses réglages, réunis au même endroit.</p><div id="h-origin" class="module-credit"></div></div>
      <div class="hdr-actions"><button class="pill" id="hdr-mic" hidden>Micro</button><button id="fab" title="Menu"></button></div>
    </header>
    <div id="offline"><span class="spin"></span><span id="offline-txt"></span><button class="pill" id="offline-diag">Diagnostic</button></div>
    <section class="page on" id="p-devices"></section>
    <section class="page" id="p-modules"></section>
    <section class="page" id="p-device"></section>
    <section class="page" id="p-mouse"></section>
    <section class="page" id="p-mixer"></section>
    <section class="page" id="p-mic"></section>
    <section class="page" id="p-hp"></section>
    <section class="page" id="p-routing"></section>
    <section class="page" id="p-light"></section>
    <section class="page" id="p-scenes"></section>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" aria-hidden="true" inert><div class="sheet-box" id="sheet-box" role="dialog" aria-modal="true" aria-label="Rustudio" tabindex="-1"></div></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<script src="/ui/js/socle.js"></script>
<script src="/ui/js/goxlr/commun.js"></script>
<script src="/ui/js/goxlr/mixeur.js"></script>
<script src="/ui/js/goxlr/micro.js"></script>
<script src="/ui/js/goxlr/casque.js"></script>
<script src="/ui/js/goxlr/routage.js"></script>
<script src="/ui/js/goxlr/eclairage.js"></script>
<script src="/ui/js/goxlr/scenes.js"></script>
<script src="/ui/js/goxlr/son-windows.js"></script>
<script src="/ui/js/attack-shark/r5-ultra.js"></script>
<script src="/ui/js/modules.js"></script>
<script src="/ui/js/menu.js"></script>
<script src="/ui/js/goxlr/voix.js"></script>
<script src="/ui/js/mises-a-jour.js"></script>
<script src="/ui/js/demarrage.js"></script>
</body>
</html>

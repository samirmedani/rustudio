name: Proposer une idée
description: Une fonctionnalité ou une amélioration pour Rustudio.
labels: ["idée"]
body:
  - type: markdown
    attributes:
      value: |
        Pour une idée encore floue ou pour en discuter d'abord, passe plutôt par les [Discussions](https://github.com/samirmedani/rustudio/discussions/categories/ideas), où chacun peut voter. Pour un nouvel appareil, utilise le formulaire « Nouvel appareil ».
  - type: textarea
    id: probleme
    attributes:
      label: Le besoin
      description: Qu'est-ce qui te manque ou te gêne aujourd'hui ?
      placeholder: "Ex. : je change de scène à la main avant chaque live, j'aimerais qu'elle suive le jeu que je lance."
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Ce que tu proposes
    validations:
      required: true
  - type: dropdown
    id: appareil
    attributes:
      label: Appareil concerné
      options:
        - GoXLR Mini
        - Attack Shark R5 Ultra
        - L'appli en général
        - Un autre appareil
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version de Rustudio
      placeholder: "5.6.12"
    validations:
      required: false

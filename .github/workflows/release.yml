name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Rustudio pour Windows
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: cargo test --locked
      - name: Le tag correspond à la version
        shell: pwsh
        run: |
          $v = (Select-String Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }}, version du code v$v" }
      - name: Paquet
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Passage depuis GoXLR Mini 4.8.0
        shell: pwsh
        run: ./scripts/migration-test.ps1
      - name: Installation complète sur la machine de test
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Mise à jour depuis la dernière release publiée (son propre updater, faux GitHub)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-update-test.ps1
      - name: Notes de version
        run: python scripts/release_notes.py "${{ github.ref_name }}" --out dist/notes.md
      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Rustudio-Setup.exe dist/Rustudio.zip dist/Rustudio.sha256 dist/GoXLR-Mini.zip dist/GoXLR-Mini.sha256 --title "Rustudio ${{ github.ref_name }}" --notes-file dist/notes.md

  after:
    name: Après publication
    needs: release
    uses: ./.github/workflows/after-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write

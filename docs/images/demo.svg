<style>text{font-family:'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
@keyframes mic{0%,9.9%{fill:#3a3a40}10%,59.9%{fill:#ff453a}60%,100%{fill:#3a3a40}}.mic{animation:mic 10s linear infinite}

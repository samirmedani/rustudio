[package]
name = "rustudio-goxlr"
description = "Rustudio : protocole USB de la GoXLR Mini (pilote officiel TC-Helicon) et fausse GoXLR pour les tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustudio-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
libloading = "0.9"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Security",
  "Win32_Storage_FileSystem", "Win32_System_IO",
] }

[package]
name = "rustudio-app"
description = "Rustudio : appli Windows native en Rust et GPUI (fenêtre, icône d'état, bulle à l'écran, périphériques son)"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "Rustudio"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

[dependencies]
rustudio-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3"

[target.'cfg(any(windows, unix))'.dependencies]
rustudio-windows-desktop = { path = "../windows-desktop" }
# le manifeste Windows est dans app.rc (même réglage que GPUI), pour partager gpui avec l'installeur
gpui = { version = "=0.2.2", default-features = false }
async-channel = "=2.5.0"
raw-window-handle = "0.6"
tray-icon = { version = "=0.23.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }

# aperçu sur Mac (développement) : shaders compilés au lancement, sans la chaîne Metal de Xcode
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
objc = "0.2"

# aperçu sous Linux (écran virtuel du serveur, développement)
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }

# macros de objc 0.2 (aperçu sur Mac)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

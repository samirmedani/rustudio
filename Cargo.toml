[workspace]
resolver = "2"
members = ["crates/core", "crates/goxlr", "crates/engine", "crates/app", "crates/setup"]
default-members = ["crates/core", "crates/goxlr", "crates/engine"]

[workspace.package]
version = "5.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/samirmedani/rustudio"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
rustudio-core = { path = "crates/core" }
rustudio-goxlr = { path = "crates/goxlr" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

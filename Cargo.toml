[workspace]
resolver = "2"
members = ["crates/core", "crates/goxlr", "crates/attack-shark", "crates/cooler-master", "crates/engine", "crates/app", "crates/setup", "crates/windows-desktop"]
default-members = ["crates/core", "crates/goxlr", "crates/attack-shark", "crates/cooler-master", "crates/engine", "crates/windows-desktop"]

[workspace.package]
version = "6.6.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/samirmedani/rustudio"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
rustudio-core = { path = "crates/core" }
rustudio-goxlr = { path = "crates/goxlr" }
rustudio-attack-shark = { path = "crates/attack-shark" }
rustudio-cooler-master = { path = "crates/cooler-master" }

# Développement en direct sur le PC (private/live-pc.mjs) : dépendances optimisées une fois, puis seule l'appli
# se recompile, sans optimisation et en incrémental : environ 3 s, 5 s jusqu'à la fenêtre relancée.
[profile.live]
inherits = "dev"
opt-level = 0
debug = false
incremental = true

[profile.live.package."*"]
opt-level = 3

# calcul de la voix (aperçu avant/après) : aussi rapide qu'en version stable
[profile.live.package.rustudio-core]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
